 L795,600" stroke="#0D716C" stroke-width="3"/><text x="40" y="754" font-size="20" font-weight="bold">Limites documentados</text><text x="40" y="787" font-size="19">Um Web, um NAT e RDS Single-AZ. Domínio CloudFront padrão com política TLSv1. Origem privada HTTP.</text><text x="40" y="816" font-size="18">A existência de duas zonas nas sub-redes não significa alta disponibilidade dos serviços.</text></g></svg>