name: Validacao local e infraestrutura simulada
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.13.5
      - name: Testes da aplicacao
        run: python3 -m unittest discover -s tests -v
      - name: Sintaxe dos instaladores
        run: for file in infra/scripts/*.sh; do bash -n "$file"; done
      - name: Sintaxe das fontes WordPress
        run: |
          if ! command -v php >/dev/null; then sudo apt-get update && sudo apt-get install -y php-cli; fi
          find wordpress -name '*.php' -print0 | xargs -0 -n 1 php -l
      - name: Preparar provedores sem backend
        run: terraform -chdir=infra init -backend=false -input=false
      - name: Formato e configuracao
        run: |
          terraform -chdir=infra fmt -check -recursive
          terraform -chdir=infra validate
      - name: Controles simulados sem credenciais AWS
        run: terraform -chdir=infra test -no-color
